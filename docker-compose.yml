services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: masiha
      MYSQL_USER: masiha
      MYSQL_PASSWORD: masiha
      MYSQL_ROOT_PASSWORD: masiha_root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umasiha", "-pmasiha"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - masiha_mysql_data:/var/lib/mysql

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: mysql://masiha:masiha@mysql:3306/masiha
    command: pnpm prisma migrate deploy
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: mysql://masiha:masiha@mysql:3306/masiha
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  masiha_mysql_data:
